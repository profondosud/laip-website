<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>LAIP - Siti Web Professionali con IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --primary-bright: #00f0ff;
            --dark: #040812;
            --darker: #010204;
            --white: #ffffff;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: #e5e7eb;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(0deg, transparent 24%, rgba(0, 212, 255, 0.01) 25%, rgba(0, 212, 255, 0.01) 26%, transparent 27%, transparent 74%, rgba(0, 212, 255, 0.01) 75%, rgba(0, 212, 255, 0.01) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 212, 255, 0.01) 25%, rgba(0, 212, 255, 0.01) 26%, transparent 27%, transparent 74%, rgba(0, 212, 255, 0.01) 75%, rgba(0, 212, 255, 0.01) 76%, transparent 77%, transparent);
            background-size: 80px 80px;
            pointer-events: none;
            z-index: 0;
        }

        main, nav, footer { position: relative; z-index: 1; }

        .binary-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .binary-line {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: rgba(0, 240, 255, 0.15);
            white-space: pre;
            animation: fall-binary 10s linear infinite;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
            line-height: 1;
            letter-spacing: 0.2em;
        }

        @keyframes fall-binary {
            0% { transform: translateY(-100vh); opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(4, 8, 18, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.15);
            z-index: 1000;
            padding: 1.2rem 2rem;
        }

        .nav-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-nav {
            height: 80px;
            display: flex;
            align-items: center;
        }

        .logo-nav img {
            height: 100%;
            width: auto;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.8)); mix-blend-mode: screen; opacity: 0.95;
        }

        .nav-links { display: flex; gap: 2.5rem; align-items: center; }

        nav a {
            color: #e5e7eb;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
            font-weight: 500;
        }

        nav a:hover { color: var(--primary); }

        .cta-btn {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .cta-btn:hover {
            background: var(--primary-bright);
            box-shadow: 0 12px 30px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Trailer */
        .trailer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #010204 0%, #0a1f3d 25%, #001a4d 50%, #0d1b3d 75%, #010204 100%);
            background-size: 400% 400%;
            animation: gradient-shift 8s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 1;
            transition: opacity 0.6s ease-in;
            pointer-events: all;
            box-shadow: inset 0 0 100px rgba(0, 212, 255, 0.1), inset 0 0 200px rgba(0, 240, 255, 0.05);
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .trailer.hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        .trailer-content {
            text-align: center;
            position: relative;
            z-index: 10;
            max-width: 900px;
            width: 100%;
            animation: content-fade 2.5s ease-out;
        }

        .trailer-image {
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin: 0 auto 3rem;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(0, 212, 255, 0.05) 100%);
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: image-slide-in 1.5s ease-out;
        }

        .trailer-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .trailer-logo {
            margin-bottom: 2rem;
            animation: lightbulb-glow 2.5s ease-out;
            display: flex;
            justify-content: center;
        }

        .trailer-logo img {
            max-width: 500px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 50px rgba(0, 212, 255, 0.6));
        }

        .trailer-subtitle {
            font-size: 1.3rem;
            color: #9ca3af;
            letter-spacing: 2px;
            font-weight: 600;
            animation: subtitle-fade 1.5s ease-out 0.5s both;
            text-transform: uppercase;
        }

        .trailer-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary);
            animation: flash-effect 0.3s ease-out 2.3s;
            z-index: 20;
        }

        @keyframes content-fade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes image-slide-in {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lightbulb-glow {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.8);
                filter: drop-shadow(0 0 0px rgba(0, 240, 255, 0)) drop-shadow(0 0 0px rgba(0, 212, 255, 0));
            }
            30% {
                opacity: 0.3;
                filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3)) drop-shadow(0 0 20px rgba(0, 212, 255, 0.1));
            }
            60% {
                opacity: 0.7;
                filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.6)) drop-shadow(0 0 40px rgba(0, 212, 255, 0.3));
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 50px rgba(0, 212, 255, 0.6));
            }
        }

        @keyframes subtitle-fade {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes flash-effect {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Main */
        main { margin-top: 70px; }

        section {
            padding: 5rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--white);
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-align: center;
            font-weight: 700;
            color: var(--white);
        }

        /* Hero */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 4rem;
            min-height: 110vh;
            animation: fadeIn 0.8s ease-out;
            margin-top: -70px;
            padding-top: 150px;
            position: relative;
        }

        .hero-content p {
            font-size: 1.1rem;
            color: #9ca3af;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 1rem 2rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: var(--primary-bright);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 0.95rem 2rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.15);
            transform: translateY(-3px);
        }

        .hero-visual {
            position: relative;
            /* foto verticale 2:3 mostrata per intero, alta al massimo quanto lo schermo */
            width: min(100%, calc((100vh - 180px) * 2 / 3));
            aspect-ratio: 2 / 3;
            justify-self: center;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
        }

        .hero-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Chi siamo */
        .section-intro {
            max-width: 760px;
            margin: -2rem auto 3.5rem;
            text-align: center;
            color: #9ca3af;
            font-size: 1.1rem;
        }

        .founders-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 320px));
            justify-content: center;
            gap: 2.5rem;
        }

        .founder-card {
            position: relative;
            aspect-ratio: 3 / 4;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.12);
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
        }

        .founder-card:hover {
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
            transform: translateY(-5px);
        }

        .founder-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .founder-name {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 3rem 1.5rem 1.3rem;
            background: linear-gradient(transparent, rgba(4, 8, 18, 0.95));
        }

        .founder-name h3 { color: var(--white); font-size: 1.5rem; line-height: 1.2; }

        .founder-name span {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 600;
        }

        /* Come lavoriamo */
        .steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2rem;
        }

        .step {
            border-top: 2px solid rgba(0, 212, 255, 0.3);
            padding-top: 1.5rem;
        }

        .step-num {
            font-family: 'Courier New', monospace;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }

        .step h3 { color: var(--white); font-size: 1.2rem; margin: 0.4rem 0 0.6rem; }
        .step p { color: #9ca3af; font-size: 0.95rem; }

        /* Progetti */
        .project-card {
            display: block;
            text-decoration: none;
        }

        .project-tag {
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 600;
        }

        .project-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Lingua */
        .lang-switch {
            display: flex;
            border: 1px solid rgba(0, 212, 255, 0.35);
            border-radius: 4px;
            overflow: hidden;
        }

        .lang-switch button {
            background: transparent;
            color: #e5e7eb;
            border: none;
            padding: 0.45rem 0.7rem;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 0.05em;
        }

        .lang-switch button[aria-pressed="true"] {
            background: var(--primary);
            color: var(--dark);
        }

        /* Features Grid */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .feature-card {
            background: rgba(20, 24, 32, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            padding: 2rem;
            transition: all 0.3s;
        }

        .feature-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            background: rgba(20, 24, 32, 0.8);
            transform: translateY(-5px);
        }

        .feature-card h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: var(--white);
        }

        .feature-card p {
            color: #9ca3af;
            font-size: 0.95rem;
        }

        /* Footer */
        footer {
            background: var(--darker);
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            padding: 3rem 2rem 1rem;
            text-align: center;
            color: #6b7280;
        }

        .footer-wrapper { max-width: 1400px; margin: 0 auto; }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            text-align: left;
            margin-bottom: 2rem;
        }

        .footer-section h4 {
            color: var(--white);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .footer-section a {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.3s;
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .footer-section a:hover { color: var(--primary); }

        .footer-bottom {
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            padding-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .hero { grid-template-columns: 1fr; gap: 2rem; min-height: auto; }
            .founders-grid { grid-template-columns: minmax(0, 320px); }
            .nav-wrapper { gap: 1rem; }
            .nav-links { display: none; }
            .logo-nav img { height: 50px; }
        }
    </style>
</head>
